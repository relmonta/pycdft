name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    name: core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install -e .
      - name: Run core tests (numpy only)
        run: pytest -m "not cross" -q

  test-cross:
    name: cross-validation (ibicus + R port, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install -e .
          pip install ibicus
      - name: Run cross tests (skipped when ibicus is missing)
        run: pytest -m cross -q
